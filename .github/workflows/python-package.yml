# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore:
    - '.gitignore'
    - '*.md'
    - '*.txt'
    - '.vscode/**'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv
        uv sync
    - name: Run checks
      run: |
        uv run ruff check
        uv run ty check
    - name: Run unit tests
      run: |
        uv run pytest
    - name: Run doctests
      run: |
        source .venv/bin/activate
        make -C docs doctest
    - name: Build package
      run: |
        uv build
    - name: Upload wheel
      uses: actions/upload-artifact@v7
      with:
        path: dist/*.whl
        archive: false
        if-no-files-found: error
    - name: Upload source
      uses: actions/upload-artifact@v7
      with:
        path: dist/*.tar.gz
        archive: false
        if-no-files-found: error

  publish-pypi:
    name: "Publish to PyPI"
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/picopod
    permissions:
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist/
        merge-multiple: true
        skip-decompress: true
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  publish-release:
    name: "Publish GitHub Release"
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        merge-multiple: true
        skip-decompress: true
    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        name: Picopod ${{ github.ref_name }}
        body: This release is from [automated build \#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
        draft: true
        files: |
          *.tar.gz
          *.whl
